<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - מערכת בקרה עתידנית</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Assistant:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="scripts/home.js"></script>
    <script src="scripts/music.js"></script>

</head>
<body id="home-screen">
    <header>
        <h1>ברוכים הבאים למערכת הבקרה</h1>
    </header>
    <main class="modal-content" style="position: relative; margin: auto; margin-top: 50px;">
        <h2 id="modal-title">הזדהות משתמש</h2>
        <!-- טופס ההתחברות ובחירת רמה -->
        <form id="login-form" >
            <div style="margin-bottom: 20px;">
                <label for="username" style="display: block; margin-bottom: 10px;">שם סוכן (משתמש):</label>
                <input type="text" id="username" name="username" style="padding: 10px; width: 80%;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="level" style="display: block; margin-bottom: 10px;">בחר רמת אבטחה (קושי):</label>
                <select id="level" name="level" style="padding: 10px; width: 85%;">
                    <option value="easy">רמה 1 - קלה (60 שניות)</option>
                    <option value="hard">רמה 2 - קשה (30 שניות)</option>
                </select>
            </div>
            <button type="submit" id="start-btn">התחבר והמשך למשחק</button>
        </form>
        <nav style="margin-top: 20px;">
            <a href="pages/instructions.html" style="color: var(--neon-blue);">הוראות מערכת</a> | 
            <a href="pages/scores.html" style="color: var(--neon-blue);">טבלת שיאי סוכנים</a>
        </nav>
    </main>
</body>
</html>
